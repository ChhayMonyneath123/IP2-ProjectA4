
services:
  laravel:
    build:
      context: ./IP2-backend
    container_name: laravel-app
    volumes:
      - ./IP2-backend:/var/www
    depends_on:
      - mysql
    networks:
      - app-network
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=laravel
      - DB_USERNAME=root
      - DB_PASSWORD=root

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "8000:80"  # expose Nginx on localhost:8000
    volumes:
      - ./IP2-backend:/var/www
      - ./IP2-backend/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - laravel
    networks:
      - app-network

  vue:
    build:
      context: ./IP2-frontend
    container_name: vue-app
    ports:
      - "5174:5173"
    volumes:
      - ./IP2-frontend:/app
      - /app/node_modules
    working_dir: /app
    command: npm run dev
    networks:
      - app-network

  mysql:
    image: mysql:8.0
    container_name: mysql
    ports:
      - "3309:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laravel
      # MYSQL_ROOT: root
      # MYSQL_PASSWORD: root
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mysql-data:

